<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pulso Coordinado · SIGBO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--dark:#10263f;--light:#f3f7f8;--mid:#657985;--line:#d5e0e3;--red:#d94b3d;--cyan:#31a8b8;--green:#168166}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;color:var(--dark);font-family:Poppins,sans-serif;background:linear-gradient(135deg,var(--light),#eaf1f3)}.container{display:flex;min-height:100vh;padding:20px;gap:20px}.sidebar{width:320px;flex-shrink:0;padding:24px;background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 10px 30px rgba(16,38,63,.1);overflow:auto}.sidebar h1{font:500 24px Lora,serif}.subtitle{margin:7px 0 28px;color:var(--mid);font-size:13px;line-height:1.45}.section{margin-bottom:28px}.section h3{margin-bottom:13px;font-size:15px}.section h3:before{content:'•';margin-right:8px;color:var(--red)}label{display:block;margin-bottom:7px;font-size:12px}.seed,.range{width:100%;margin-bottom:10px}.seed{padding:10px;text-align:center;background:var(--light);border:1px solid var(--line);border-radius:7px}.row{display:flex;gap:8px}.button{width:100%;padding:9px;color:white;background:var(--red);border:0;border-radius:6px;cursor:pointer}.button.secondary{background:var(--cyan)}.button.tertiary{background:var(--green)}.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}#canvas-container{width:100%;max-width:900px;overflow:hidden;background:white;border-radius:12px;box-shadow:0 20px 40px rgba(16,38,63,.12)}canvas{display:block;width:100%!important;height:auto!important}@media(max-width:650px){.container{flex-direction:column}.sidebar{width:100%}}
  </style>
</head>
<body><div class="container"><aside class="sidebar"><h1>Pulso Coordinado</h1><p class="subtitle">Campo generativo para la identidad visual de SIGBO.</p>
  <section class="section"><h3>Semilla</h3><input class="seed" id="seed" type="number" value="2405" onchange="setSeed()"><div class="row"><button class="button secondary" onclick="step(-1)">← Anterior</button><button class="button secondary" onclick="step(1)">Siguiente →</button></div><button class="button tertiary" style="margin-top:8px" onclick="randomize()">↻ Aleatoria</button></section>
  <section class="section"><h3>Parámetros</h3><label>Densidad <span id="density-v">900</span></label><input class="range" id="density" type="range" min="300" max="1800" step="100" value="900" oninput="update('density',this.value)"><label>Deriva <span id="drift-v">0.9</span></label><input class="range" id="drift" type="range" min="0.2" max="2" step="0.1" value="0.9" oninput="update('drift',this.value)"><label>Radio <span id="radius-v">260</span></label><input class="range" id="radius" type="range" min="140" max="390" step="10" value="260" oninput="update('radius',this.value)"></section>
  <section class="section"><h3>Acciones</h3><div class="row"><button class="button" onclick="resetAll()">Restablecer</button><button class="button secondary" onclick="saveCanvas('pulso-'+params.seed,'png')">Descargar PNG</button></div></section>
  </aside><main class="canvas-area"><div id="canvas-container"></div></main></div>
<script>
let params={seed:2405,density:900,drift:.9,radius:260},defaults={...params},particles=[];
function setup(){let c=createCanvas(1000,1000);c.parent('canvas-container');initializeSystem()}
function initializeSystem(){randomSeed(params.seed);noiseSeed(params.seed);particles=[];for(let i=0;i<params.density;i++){let a=random(TWO_PI),r=random(params.radius*.2,params.radius*1.65);particles.push({x:width/2+cos(a)*r,y:height/2+sin(a)*r,life:random(90,260),tone:random()})}background('#f3f7f8')}
function draw(){noStroke();fill(243,247,248,9);rect(0,0,width,height);for(const p of particles){let dx=p.x-width/2,dy=p.y-height/2,a=atan2(dy,dx)+HALF_PI,field=(noise(p.x*.002,p.y*.002,frameCount*.001)-.5)*params.drift;let speed=1.1+noise(p.x*.01,p.y*.01);p.x+=cos(a+field)*speed;p.y+=sin(a+field)*speed;p.life--;let d=dist(p.x,p.y,width/2,height/2);let c=p.tone>.94?'#d94b3d':p.tone>.58?'#31a8b8':'#10263f';stroke(c);strokeWeight(p.tone>.94?1.6:.65);point(p.x,p.y);if(p.life<0||d>470){let q=random(TWO_PI),r=random(params.radius*.3,params.radius);p.x=width/2+cos(q)*r;p.y=height/2+sin(q)*r;p.life=random(100,260)}}}
function update(k,v){params[k]=Number(v);document.getElementById(k+'-v').textContent=v;initializeSystem()}function setSeed(){params.seed=Math.max(1,Number(document.getElementById('seed').value)||1);initializeSystem()}function step(n){params.seed=Math.max(1,params.seed+n);document.getElementById('seed').value=params.seed;initializeSystem()}function randomize(){params.seed=Math.floor(Math.random()*999999)+1;document.getElementById('seed').value=params.seed;initializeSystem()}function resetAll(){params={...defaults};for(const k of ['density','drift','radius']){document.getElementById(k).value=params[k];document.getElementById(k+'-v').textContent=params[k]}document.getElementById('seed').value=params.seed;initializeSystem()}
</script></body></html>

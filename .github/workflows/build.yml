name: Verificar compilacion
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proyecto: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.proyecto }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: matrix.proyecto == 'backend'
        run: npm run test:ci
      - if: matrix.proyecto == 'frontend'
        run: npm run audit:a11y

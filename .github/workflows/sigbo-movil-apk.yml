# Compila el APK de la app movil SIGBO (Flutter) sin necesidad de SDK local.
# Se ejecuta al cambiar archivos de .movile/ o manualmente (Actions > SIGBO movil APK).
name: SIGBO movil APK

on:
  push:
    paths:
      - ".movile/**"
      - "backend/src/modules/gre/**"
      - "scripts/matpel/compilar_motor_local.cjs"
      - "scripts/matpel/motor_local_runtime.js"
      - ".github/workflows/sigbo-movil-apk.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de fabrica del backend (opcional, se cambia en la app)"
        required: false
        default: ""

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .movile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verificar motor GRE compartido
        working-directory: .
        run: |
          npm ci --prefix backend
          node scripts/matpel/compilar_motor_local.cjs --check

      - name: Preparar wrapper Android
        run: |
          flutter create --org org.cbvc.sigbo --project-name sigbo_alertas \
            --platforms android --android-language kotlin --no-pub /tmp/sigbo-base
          # El proyecto Android versionado contiene el motor GRE y el OCR local.
          # Recuperar solo los binarios/scripts del wrapper ignorados por Git.
          cp /tmp/sigbo-base/android/gradlew android/gradlew
          cp /tmp/sigbo-base/android/gradlew.bat android/gradlew.bat
          cp /tmp/sigbo-base/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Dependencias y analisis
        run: |
          flutter pub get
          flutter analyze

      - name: Compilar APK depuracion
        env:
          SIGBO_API_URL: ${{ inputs.api_url }}
        run: |
          if [ -n "$SIGBO_API_URL" ]; then
            flutter build apk --debug "--dart-define=SIGBO_API_URL=$SIGBO_API_URL"
          else
            flutter build apk --debug
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: sigbo-alertas-debug
          path: .movile/build/app/outputs/flutter-apk/app-debug.apk
